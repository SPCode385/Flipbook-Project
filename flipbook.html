<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Digital Flipbook</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>

<body>


  <div class="container-fluid mt-3">
    <div class="row">
      <!-- <div class="col-md-2 thumbnails" id="thumbnails"></div> -->
      <div class="col-md-10 text-center">
        <div id="flipbook"></div>
        <div class="my-page">
          <!-- your page content -->
        </div>
      </div>
    </div>

    <nav class="navbar navbar-dark bg-dark px-4">
      <button class="btn btn-light btn-sm" onclick="prevPage()">◀</button>
      <span id="pageNumber" class="text-white mx-2">Page 1</span>
      <button class="btn btn-light btn-sm" onclick="nextPage()">▶</button>
      <button class="btn btn-warning btn-sm" onclick="zoom()">🔍</button>
      <button class="btn btn-danger btn-sm" onclick="resetZoom()">⟲</button>
      <button class="btn btn-success btn-sm" onclick="fullscreen()">⛶</button>
    </nav>
  </div>




  <audio id="flipSound" src="flip.mp3"></audio>



  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/blasten/turn.js/turn.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
